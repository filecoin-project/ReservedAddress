[profile.default]
src = 'src'
test = 'test'
script = 'script'
out = 'out'
libs = ['lib']
cache_path = 'cache'
solc = "0.8.36"
optimizer = true
optimizer_runs = 999999
bytecode_hash = "none"
cbor_metadata = false

# For dependencies
remappings = [
    'forge-std/=lib/forge-std/src/',
]
ignored_error_codes = [
    2424, # https://github.com/Vectorized/solady/issues/1512
]

[lint]
severity = ["high", "med", "low", "info", "gas", "code-size"]
exclude_lints = [
    'unchecked-call',
]
